name: CI and Docker Hub
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sh scripts/test.sh
      - run: docker compose --env-file .env.example config --quiet

  images:
    name: Image / ${{ matrix.target }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [controller, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Release identity from commit time (Asia/Shanghai)
        id: release
        run: |
          echo "version=$(TZ=Asia/Shanghai date -d "@$(git show -s --format=%ct HEAD)" +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check publishing credentials
        if: github.event_name != 'pull_request'
        env:
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$HUB_USERNAME" ] || [ -z "$HUB_TOKEN" ]; then
            echo "::error::Set repository Variable DOCKERHUB_USERNAME and Secret DOCKERHUB_TOKEN before publishing."
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || github.repository_owner }}/sync-pic-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            BUILD_REVISION=${{ steps.release.outputs.revision }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=min
      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/sync-pic-${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE@$DIGEST"
